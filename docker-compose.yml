services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: >
      sh -c "alembic upgrade head && python scripts/bootstrap_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://stockroom:stockroom@db:5432/stockroom
      LOG_LEVEL: INFO
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in .env or the environment}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && python -m app.worker.expiry"
    environment:
      DATABASE_URL: postgresql+psycopg://stockroom:stockroom@db:5432/stockroom
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy

  test:
    profiles: ["test"]
    build: .
    command: >
      sh -c "pip install --no-cache-dir pytest && pytest -m postgres"
    environment:
      API_BASE_URL: http://api:8000
      TEST_DATABASE_URL: postgresql+psycopg://stockroom:stockroom@db:5432/stockroom
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in .env or the environment}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
