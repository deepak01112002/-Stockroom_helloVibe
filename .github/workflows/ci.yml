name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . ruff mypy pytest
      - run: ruff check .
      - run: mypy app
      - run: pytest
      - run: PAYMENT_WEBHOOK_SECRET=ci-test-secret docker compose config --quiet
      - run: >
          PAYMENT_WEBHOOK_SECRET=ci-test-secret docker compose --profile test up --build
          --abort-on-container-exit --exit-code-from test
      - if: always()
        run: PAYMENT_WEBHOOK_SECRET=ci-test-secret docker compose --profile test down -v
